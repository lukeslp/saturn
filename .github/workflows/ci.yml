name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[web,dev]'
      - run: SATURN_NO_NETWORK=1 python -m pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install built wheel with extras
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "saturn-dissect[web,llm] @ file://$PWD/$wheel"
      - run: saturn version
      - run: saturn --help
      - run: python -c "from saturn.llm.gateway import parse_provider_spec; assert parse_provider_spec('anthropic').provider == 'anthropic'"
