[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saturn-dissect"
version = "0.3.0"
description = "Dataset dissector: polars-native profiling, HTML + JSON reports, optional multi-provider LLM insight pass, live Flask viewer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Steuber", email = "luke@lukesteuber.com" }]
keywords = ["dataset", "profiling", "nlp", "eda", "bluesky", "alt-text", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2",
    "numpy>=1.26",
    "scipy>=1.12",
    "plotly>=5.20",
    "jinja2>=3.1",
    "duckdb>=1.0",
    "polars>=1.0",
    "datasets>=3",
    "textstat>=0.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "bertopic>=0.16",
    "fasttext-wheel>=0.9",
]
llm = [
    "litellm>=1.84.0",
    # Tolerant JSON5 parser — fallback when the strict parser fails on
    # Opus-style trailing commas / missing commas in long structured outputs.
    "pyjson5>=1.6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.23",
    # The offline parsing tests exercise the tolerant [llm] fallback.
    "pyjson5>=1.6",
]
web = [
    "flask>=3.0",
    "werkzeug>=3.0",
    # Spreadsheet ingestion for uploaded .xlsx / .xls / .xlsb / .ods
    "fastexcel>=0.10",
    "xlsxwriter>=3.0",
    "gunicorn>=22",
    "markdown>=3.6",
    "bleach>=6.1",
]
all = [
    "saturn-dissect[nlp,llm,web,dev]",
]

[project.scripts]
saturn = "saturn.entrypoint:main"

[project.urls]
Homepage = "https://github.com/lukeslp/saturn"
Repository = "https://github.com/lukeslp/saturn"

[tool.hatch.build.targets.wheel]
packages = ["saturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
