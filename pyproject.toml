[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saturn-dissect"
version = "0.1.0"
description = "Dataset dissector: multi-provider language-model analysis + Python NLP and statistics, CLI-first"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Steuber", email = "luke@lukesteuber.com" }]
keywords = ["dataset", "profiling", "nlp", "eda", "bluesky", "alt-text", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2",
    "numpy>=1.26",
    "scipy>=1.12",
    "plotly>=5.20",
    "jinja2>=3.1",
    "duckdb>=1.0",
    "polars>=1.0",
    "datasets>=3",
    "textstat>=0.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "bertopic>=0.16",
]
llm = [
    # Provider clients are pulled in via shared/llm_providers; optional here if running without ~/shared on PYTHONPATH
    "anthropic>=0.30",
    "openai>=1.30",
    "groq>=0.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
all = [
    "saturn-dissect[nlp,llm,dev]",
]

[project.scripts]
saturn = "saturn.cli:app"

[project.urls]
Homepage = "https://github.com/lukeslp/saturn"
Repository = "https://github.com/lukeslp/saturn"

[tool.hatch.build.targets.wheel]
packages = ["saturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
